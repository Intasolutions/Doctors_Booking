<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>You're offline · CareSlot</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: #f3f7fb;
        color: #0e2236;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 26rem; text-align: center; display: grid; gap: 14px; justify-items: center; }
      img { width: 72px; height: 72px; }
      h1 { margin: 6px 0 0; font-size: 26px; letter-spacing: -0.01em; }
      p { margin: 0; color: #55687c; }
      button {
        margin-top: 8px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: #1b64da;
        color: #fff;
        font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #1b64da; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>CareSlot needs an internet connection to show free times and to book, so they're always up to date.</p>
      <p>Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.reload()" autofocus>Try again</button>
    </main>
    <script>
      // Come back by itself as soon as the connection returns.
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
